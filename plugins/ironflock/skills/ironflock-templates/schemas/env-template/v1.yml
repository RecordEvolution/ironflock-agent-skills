$schema: "https://json-schema.org/draft/2020-12/schema"
$id: https://ironflock.com/schemas/env-template/v1.yml
title: IronFlock Environment Variable Template
description: Schema for validating IronFlock environment variable templates.
type: object
patternProperties:
  "^[A-Z0-9_]+$":
    type: object
    required: [label, type]
    properties:
      label:
        type: string
        description: Label displayed above the input field.
      type:
        type: string
        enum: [numeric, text, textarea, boolean]
        description: Type of value.
      defaultValue:
        description: Default value.
        oneOf:
          - type: string
          - type: number
          - type: boolean
      description:
        type: string
        description: Description of the variable.
      unit:
        type: string
        description: Unit label shown beside numeric values.
      max:
        type: number
        description: Maximum value (for numeric types).
      min:
        type: number
        description: Minimum value (for numeric types).
      secret:
        type: boolean
        description: Whether to mask the value as a secret.
      valueList:
        description: Dropdown selection values.
        type: array
        items:
          oneOf:
            - type: number
            - type: string
additionalProperties: false
